[project]
name = "telegram-class-notice-bot"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
exclude = ["^venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."] 
